name: CityScape 1.8 CI & Distribution Packaging

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    name: Build Authentic Assemblies, Package & Verify Suites

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK & MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pefile dnfile dncil capstone

      - name: Build All Architectures (x86, x64, ARM64)
        shell: cmd
        run: |
          call build.bat -Rebuild

      - name: Package Portable Distributions
        shell: cmd
        run: |
          call package.bat -SkipBuild

      - name: Run Full 9-Suite Automated Verification
        shell: cmd
        run: |
          call test.bat

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CityScape-1.8-Portable-Distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14
